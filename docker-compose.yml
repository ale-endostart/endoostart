version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: supabase_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - supabase_network

  # Supabase Studio (Web UI)
  studio:
    image: supabase/studio:latest
    container_name: supabase_studio
    environment:
      SUPABASE_URL: http://localhost:8000
      SUPABASE_ANON_KEY: ${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0b3JhZ2Utc3R1ZGlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE2NjE3NjAxNDAsImV4cCI6MTk3NzMzNjE0MH0.SreKJmPr3I5nAc_8y1J5q-C_pqKvLBr6dErnzYTBqEs}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0b3JhZ2Utc3R1ZGlvIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTY2MTc2MDEyNywiZXhwIjoxOTc3MzM2MTI3fQ.uI_oL6oLaOb_hYd4rrB5g_7xK3v3UQr4-P5u3gSd9q4}
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - supabase_network

networks:
  supabase_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
